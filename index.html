<!doctype html>
<html lang="en">
<head>
    <title>Mispa_CXL_Pro</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/focus-visible@5.0.2/dist/focus-visible.js" defer></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX'); // Replace with your GA4 ID
    </script>
    <style>
  h5 {
    text-align: center;
    margin-top: -5px;
    font-size: 9px;
    color: #636363; /* Optional: Set text color to improve visibility */
  }

  .attributiontwo {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    justify-content: center;
    padding: 10px 0;
    flex-wrap: nowrap;
    align-content: center;

  }

  .attributiontwo span {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
  }

  .attributiontwo a {
    margin: 10px;
  }

  .icon {
    width: 35px;
    height: 45px;
    transition: transform 0.3s ease;
  }

  .icon:hover {
    transform: scale(1.1); /* Optional: Add hover effect for images */
  }

  .attributiontwo img {
    width: 35px;  /* Increased size */
    height: 45px; /* Increased size */
  }

  .attributiontwo a {
    text-decoration: none; /* Remove underline from links */
  }

  /* Add responsive styling for mobile */
  @media (max-width: 600px) {
    .attributiontwo {
      padding: 15px;
    }
    .icon {
      width: 30px;
      height: 40px;
    }
  }
</style>

</head>
<body>
    <div id="card">
        <model-viewer 
            id="model-viewer" 
            src="CXL.glb" 
            ar ar-modes="webxr scene-viewer quick-look" 
            camera-controls 
            poster="loading.gif" 
            shadow-intensity="0.88" 
            shadow-softness="1" 
            exposure="1">
            <button slot="ar-button" id="ar-button">View in 4D</button>
        </model-viewer>
        <div id="button">
            <img src="4.png" style="width:100px; padding-left: 10px; padding-top: 10px;" />
            <img src="iitname.png" style="width:100px; padding-right: 10px; padding-top: 10px;" />    
        </div>
    </div>
    <section class="attributiontwo">
        <a href="https://www.agappe.com/media/catalog/product/file/Mispa_CXL_Pro.pdf" class="track-button" data-name="Brochure"><img src="Brochure_1.png" class="icon" /></a>
        <a href="https://www.agappe.com/in" class="track-button" data-name="Website"><img src="web_1.png" class="icon" /></a>
        <a href="https://www.youtube.com/watch?v=gGXQ2YDdIFY" class="track-button" data-name="Video"><img src="Video_1.png" class="icon" /></a>
    </section>
    <script>
        let modelViewer = document.getElementById('model-viewer');
        let startTime;
        
        modelViewer.addEventListener('load', () => {
            startTime = Date.now();
        });
        
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                gtag('event', 'ar_view', {
                    event_category: 'Model Interaction',
                    event_label: 'AR Mode Activated'
                });
            }
        });
        
        modelViewer.addEventListener('camera-change', () => {
            gtag('event', 'camera_move', {
                event_category: 'Model Interaction',
                event_label: 'Camera Moved'
            });
        });
        
        modelViewer.addEventListener('zoom', () => {
            gtag('event', 'zoom', {
                event_category: 'Model Interaction',
                event_label: 'Zoom Performed'
            });
        });
        
        window.addEventListener('beforeunload', () => {
            let viewDuration = (Date.now() - startTime) / 1000;
            gtag('event', 'view_duration', {
                event_category: 'Model Interaction',
                event_label: 'Model View Duration',
                value: viewDuration
            });
        });
        
        document.querySelectorAll('.track-button').forEach(button => {
            button.addEventListener('click', (event) => {
                gtag('event', 'button_click', {
                    event_category: 'External Links',
                    event_label: event.currentTarget.dataset.name
                });
            });
        });
    </script>
</body>
</html>
