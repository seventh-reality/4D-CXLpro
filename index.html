<!doctype html>
<html lang="en">
  <head>
    <title>Mispa_CXL_Pro</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/focus-visible@5.0.2/dist/focus-visible.js" defer></script>
    <link rel="stylesheet" href="css/font-icons.css" type="text/css" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V1TMNVP8E5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-V1TMNVP8E5');
    </script>

    <!-- Hotjar Tracking Code (Heatmaps) -->
    <script>
      (function(h,o,t,j,a,r){
          h.hj=h.hj||function(){(h.hj.q=h.hj.q||[]).push(arguments)};
          h._hjSettings={hjid:YOUR_HOTJAR_SITE_ID,hjsv:6};
          a=o.getElementsByTagName('head')[0];
          r=o.createElement('script');r.async=1;
          r.src=t+h._hjSettings.hjid+j+h._hjSettings.hjsv;
          a.appendChild(r);
      })(window,document,'https://static.hotjar.com/c/hotjar-','.js?sv=');
    </script>
  </head>
  <body>
    <div id="card">
      <model-viewer id="model" src="CXL.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls poster="loading.gif" shadow-intensity="0.88" shadow-softness="1" exposure="1">
        <div class="progress-bar hide" slot="progress-bar">
            <div class="update-bar"></div>
        </div>
        <button slot="ar-button" id="ar-button">View in 4D</button>
        <div id="button" style="display: flex; justify-content: space-between;">
          <img src="4.png" align="center" style="width:100px; padding-left: 10px; padding-top: 10px;" />
          <img src="iitname.png" style="width:100px; padding-right: 10px; padding-top: 10px;" />    
        </div>
        <div id="ar-prompt"><img src="ar_hand_prompt.png"></div>
      </model-viewer>
      
      <section class="attributiontwo">
        <p style="background-image: url('black.png'); width: 60px; height: 60px; padding-left: 0px; padding-top: 10px;">
          <span>
            <a href="https://www.agappe.com/media/catalog/product/file/Mispa_CXL_Pro.pdf" class="track-button" data-name="Brochure">
              <img src="Brochure_1.png" class="icon" />
            </a>
            <a href="https://www.agappe.com/in" class="track-button" data-name="Website">
              <img src="web_1.png" class="icon" />
            </a>
            <a href="https://www.youtube.com/watch?v=gGXQ2YDdIFY" class="track-button" data-name="Video">
              <img src="Video_1.png" class="icon" />
            </a>
            <a href="https://drive.google.com/file/d/1hFf5OK8XdV_q6UZ7WFcwiR3xrxWkUQ4Z/view" class="track-button" data-name="Analytics">
              <img src="analytics_1.png" class="icon" />
            </a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSew4D56CSKpONvc30Ay7cLUY6FnPCOs7zK9IPYRLQWQPswbsg/viewform" class="track-button" data-name="Form">
              <img src="form_1.png" class="icon" />
            </a>
            <h5>CLICK ON THE ABOVE BUTTONS FOR MORE FEATURES</h5>
          </span>
        </p>
      </section>
    </div>
    
    <script>
      let model = document.getElementById('model');
      let startTime, endTime;
      
      model.addEventListener('load', () => {
        startTime = Date.now();
      });
      
      model.addEventListener('ar-status', (event) => {
        if (event.detail.status === 'session-started') {
          gtag('event', 'ar_view', {'event_category': 'Model Interaction'});
        }
      });
      
      model.addEventListener('camera-change', () => {
        gtag('event', 'model_rotate', {'event_category': 'Model Interaction'});
      });
      
      model.addEventListener('scale-change', () => {
        gtag('event', 'model_scale', {'event_category': 'Model Interaction'});
      });
      
      window.addEventListener('beforeunload', () => {
        endTime = Date.now();
        let timeSpent = (endTime - startTime) / 1000;
        gtag('event', 'model_view_time', {
          'event_category': 'Model Interaction',
          'value': timeSpent
        });
      });
      
      document.querySelectorAll('.track-button').forEach(button => {
        button.addEventListener('click', (event) => {
          let buttonName = event.currentTarget.getAttribute('data-name');
          gtag('event', 'button_click', {
            'event_category': 'User Interaction',
            'event_label': buttonName
          });
        });
      });
    </script>
    
    <script src="script.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.0.1/model-viewer.min.js"></script>
  </body>
</html>

<style>
  h5 {
    text-align: center;
    margin-top: -5px;
    font-size: 9px;
    color: #636363; /* Optional: Set text color to improve visibility */
  }

  .attributiontwo {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 0;
  }

  .attributiontwo span {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
  }

  .attributiontwo a {
    margin: 10px;
  }

  .icon {
    width: 35px;
    height: 45px;
    transition: transform 0.3s ease;
  }

  .icon:hover {
    transform: scale(1.1); /* Optional: Add hover effect for images */
  }

  .attributiontwo img {
    width: 35px;  /* Increased size */
    height: 45px; /* Increased size */
  }

  .attributiontwo a {
    text-decoration: none; /* Remove underline from links */
  }

  /* Add responsive styling for mobile */
  @media (max-width: 600px) {
    .attributiontwo {
      padding: 15px;
    }

    }
  }
</style>
